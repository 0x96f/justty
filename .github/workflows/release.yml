name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        run: |
          for app in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Test
        run: |
          xcodebuild \
            -project justty.xcodeproj \
            -scheme justty \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            test

      # Same stable self-signed identity on every release so users can verify
      # Authority + SHA-256 fingerprint. Generate secrets per docs/SIGNING.md.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64}" ] || [ -z "${P12_PASSWORD}" ]; then
            echo "::error::SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD secrets are required. See docs/SIGNING.md."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: |
          xcodebuild \
            -project justty.xcodeproj \
            -scheme justty \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Justty Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            build

      - name: Verify signature
        run: |
          APP="DerivedData/Build/Products/Release/Justty.app"
          codesign -dv --verbose=4 "$APP"
          codesign --verify --verbose=4 "$APP"
          if ! codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Authority=Justty Self-Signed'; then
            echo "::error::Expected Authority=Justty Self-Signed"
            exit 1
          fi
          # Pin leaf cert SHA-256 — CN alone is forgeable.
          EXPECTED="829BF99FA6C3286498C35724043AF2CD714B35BDD1C288B7D886B6C2DDE22C11"
          CERT_PREFIX="$RUNNER_TEMP/justty-codesign-cert"
          codesign -d --extract-certificates="$CERT_PREFIX" "$APP"
          LEAF="${CERT_PREFIX}0"
          if [ ! -f "$LEAF" ]; then
            echo "::error::Could not extract leaf certificate from app."
            exit 1
          fi
          ACTUAL="$(openssl x509 -inform DER -in "$LEAF" -noout -fingerprint -sha256 \
            | awk -F= '{print toupper($2)}' | tr -d ':')"
          echo "Leaf SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing cert fingerprint mismatch (expected $EXPECTED)."
            exit 1
          fi
          rm -f "${CERT_PREFIX}"*

      - name: Package
        run: |
          ditto -c -k --keepParent \
            DerivedData/Build/Products/Release/Justty.app \
            Justty-macos.zip

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Justty-macos.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew cask
        env:
          # gh auth setup-git uses GH_TOKEN; keep token out of clone URLs and avoid
          # Authorization: Bearer + http.extraHeader, which fails on macOS runners
          # ("could not read Username for 'https://github.com'").
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump. See docs/HOMEBREW.md."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Refusing cask bump: tag version '$VERSION' is not a safe semver-like string."
            exit 1
          fi
          SHA="$(shasum -a 256 Justty-macos.zip | awk '{print $1}')"
          gh auth setup-git
          git clone --depth 1 "https://github.com/0x96f/homebrew-justty.git" tap
          CASK_FILE="tap/Casks/justty.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          # Use | delimiter so VERSION/SHA cannot break the sed expression.
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/justty.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "justty ${VERSION}"
            git push
          fi
